<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Die unmögliche Aufgabe</title>
    <style>
        :root {
            color-scheme: dark;
            font-family: "Trebuchet MS", Arial, sans-serif;
            background: #101126;
            color: #f4f2ff;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 24px;
            background:
                radial-gradient(ellipse at top, rgba(130, 76, 255, 0.28), transparent 55%),
                #101126;
        }

        main {
            width: min(100%, 620px);
            padding: clamp(24px, 6vw, 48px);
            border: 1px solid rgba(190, 164, 255, 0.35);
            border-radius: 24px;
            background: rgba(26, 26, 55, 0.94);
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.45);
            text-align: center;
        }

        .tag {
            color: #c6a8ff;
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 0.16em;
            text-transform: uppercase;
        }

        h1 {
            margin: 12px 0;
            font-size: clamp(2rem, 7vw, 3.2rem);
        }

        p {
            color: #d0cee0;
            line-height: 1.6;
        }

        #equation {
            margin: 30px 0;
            padding: 24px 12px;
            border-radius: 16px;
            background: #17172f;
            color: #82f7dc;
            font-size: clamp(2rem, 9vw, 4rem);
            font-weight: 800;
            font-variant-numeric: tabular-nums;
            text-shadow: 0 0 22px rgba(130, 247, 220, 0.3);
        }

        form {
            display: grid;
            gap: 12px;
            margin-top: 26px;
            text-align: left;
        }

        label {
            font-weight: 700;
        }

        input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #555078;
            border-radius: 10px;
            background: #111124;
            color: #fff;
            font: inherit;
        }

        input:focus {
            border-color: #c6a8ff;
            outline: 3px solid rgba(198, 168, 255, 0.22);
        }

        button {
            padding: 14px 18px;
            border: 0;
            border-radius: 10px;
            background: linear-gradient(100deg, #8c5bff, #5c7cff);
            color: white;
            cursor: pointer;
            font: inherit;
            font-weight: 800;
            transition: transform 160ms ease, filter 160ms ease;
        }

        button:hover {
            filter: brightness(1.12);
            transform: translateY(-2px);
        }

        #message {
            min-height: 1.5em;
            margin: 0;
            color: #ffbf8a;
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #c6a8ff;
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                scroll-behavior: auto !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <main>
        <div class="tag">Knopf 6 · Kopfrechnen</div>
        <h1>Löse die Aufgabe</h1>
        <p>Berechne das Ergebnis.</p>
        <div id="equation" aria-live="polite" aria-atomic="true"></div>

        <form id="answer-form">
            <label for="answer">Deine Antwort</label>
            <input id="answer" name="answer" type="text" autocomplete="off"
                placeholder="Hier kannst du etwas eingeben oder das Feld leer lassen">
            <button type="submit">Weiter</button>
            <p id="message" role="status"></p>
        </form>

        
    </main>

    <script>
        const equation = document.getElementById("equation");
        const form = document.getElementById("answer-form");
        const answer = document.getElementById("answer");
        const message = document.getElementById("message");

        const numbers = [
            Math.floor(Math.random() * 90) + 10,
            Math.floor(Math.random() * 20) + 2,
            Math.floor(Math.random() * 90) + 10
        ];

        function showEquation() {
            equation.textContent = `${numbers[0]} × ${numbers[1]} + ${numbers[2]} = ?`;
        }

        function changeOneNumber() {
            const index = Math.floor(Math.random() * numbers.length);
            const minimum = index === 1 ? 2 : 10;
            const maximum = index === 1 ? 21 : 99;
            const direction = numbers[index] === minimum ? 1
                : numbers[index] === maximum ? -1
                : Math.random() < 0.5 ? -1 : 1;

            numbers[index] += direction;
            showEquation();
        }

        showEquation();
        window.setInterval(changeOneNumber, 1500);

        form.addEventListener("submit", (event) => {
            event.preventDefault();

            if (answer.value.trim() === "") {
                window.location.href = "Quiz.html";
                return;
            }

            message.textContent = "Falsch! Und jetzt sind die Zahlen schon wieder anders.";
            answer.value = "";
            answer.focus();
            changeOneNumber();
        });
    </script>
</body>
</html>
